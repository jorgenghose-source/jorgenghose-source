</script><script>(()=>{'use strict';const $=id=>document.getElementById(id),c=$('sea'),ctx=c.getContext('2d'),panel=$('panel'),hud=$('hud'),nav=$('nav'),touch=$('touch');let s=null,mode='menu',keys={},last=0,clock=0,zoom=1,cam={x:1700,y:900},battle=null,duel=null,port=null,notice='',audio,volume=.25,acc=0;const W=3150,H=2050,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),esc=x=>String(x).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));function rand(){s.randomState=(Math.imul(s.randomState,1664525)+1013904223)>>>0;return s.randomState/4294967296}function ship(i,name){let d=D.classes[i];return {id:'ship'+Math.floor(rand()*1e12),type:i,name,hull:d.hull,sail:100,crew:d.min+10,cannons:d.cannon,cargo:Array(13).fill(0),upgrades:[]}}const flag=()=>s.fleet[0],crew=()=>s.fleet.reduce((a,b)=>a+b.crew,0),cargo=()=>flag().cargo.reduce((a,b)=>a+b,0),capacity=()=>D.classes[flag().type].cargo+(flag().upgrades.includes('Cargo hold')?25:0);function say(t){notice=t}function sound(f=180){try{audio??=new AudioContext();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(volume*.15,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.21)}catch{}}function button(t,fn,parent=panel){let b=document.createElement('button');b.textContent=t;b.onclick=()=>{sound();fn()};parent.append(b);return b}function view(title,html=''){panel.innerHTML='<h2>'+esc(title)+'</h2>'+html;mode='panel'}function resume(){panel.innerHTML='';mode='sail';hud.hidden=nav.hidden=touch.hidden=false}function save(slot='auto'){if(!s)return;try{localStorage.setItem('pcl-'+slot,JSON.stringify(s));say('Career saved')}catch{say('Storage unavailable; export your career.')}}function load(slot){try{let v=JSON.parse(localStorage.getItem('pcl-'+slot));restore(v Sea Wren')];s.world.ports=D.ports.map(([name,lon,lat,n],i)=>({id:i,name,...xy(lon,lat),nation:s.year<1640&&n!==2&&i%3===0?2:n,stock:D.goods.map(()=>20+Math.floor(rand()*80)),wealth:40+Math.floor(rand()*60)}));let p=s.world.ports.find(p=>p.nation===s.nation)||s.world.ports[0];s.pos={x:p.x,y:p.y+12};for(let i=0;i<48;i++){let a=s.world.ports[i%46],b=s.world.ports[Math.floor(rand()*46)],v=ship(Math.floor(rand()*9),' '+['Silver','Crimson','Golden','Storm'][i%4]+' '+['Gull','Rose','Lion','Star'][i%4]+' '+(i+1));Object.assign(v,{x:a.x,y:a.y+15,nation:a.nation,dest:b.id,origin:a.id,heading:0,gold:50+Math.floor(rand()*250)});v.cargo[1+i%12]=10;s.world.ships.push(v)}cam={...s.pos};resume();save()});button('Back',menu)}function nearest(){return [...s.world.ports,...s.world.ships].sort((a,b)=>dist(a,s.pos)-dist(b,s.pos))[0]}function interact(){let p=nearest();if(dist(p,s.pos)>65)return say('Sail closer to a port or vessel.');if(p.stock){port=p;portMenu()}else encounter(p)}function portMenu(){view(port.name,`<p>${D.nations[port.nation]} • Prosperity ${port.wealth} • Reputation ${s.rep[port.nation]}</p>`);if(s.rep[port.nation]<-40){button('Pay entry fee (100)',()=>{if(s.gold>=100){s.gold-=100;s.rep[port.nation]=-40;portMenu()}})}else{button('Marketplace',market);button('Tavern',tavern);button('Shipwright',wright);button('Governor',governor);button('Divide plunder',divide);button('Retire',retire)}button('Depart',()=>{save();resume()})}function price(i){return Math.max(2,Math.round((6+i*3)*80/(port.stock[i]+30)*(1-s.rep[port.nation]/500)))}function market(){view('Marketplace',`<p>Gold ${s.gold} • Cargo ${cargo()}/${capacity()} • Food ${s.food.toFixed(1)}</p>`);D.goods.forEach((g,i)=>{let r=document.createElement('div');r.textContent=g+' — '+price(i)+' gold • '+port.stock[i]+' available ';panel.append(r);button('Buy',()=>{let p=price(i);if(s.gold>=p&&port.stock[i]>0&&(i===0||cargo()<capacity())){s.gold-=p;port.stock[i]--;if(i===0)s.food++;else flag().cargo[i]++}market()},r);button('Sell',()=>{if(i===0?s.food>=1:flag().cargo[i]>0){s.gold+=Math.floor(price(i)*.8);port.stock[i]++;if(i===0)s.food--;else flag().cargo[i]--}market()},r)});button('Back',portMenu)}function tavern(){view('The tavern',`<p>Morale ${Math.round(s.morale)} • Crew ${crew()}</p>`);button('Recruit 5 sailors (25)',()=>{if(s.gold>=25&&flag().crew+5<=D.classes[flag().type].crew){s.gold-=25;flag().crew+=5}tavern()});button('Buy a round (15)',()=>{if(s.gold>=15){s.gold-=15;s.morale=clamp(s.morale+12,0,100)}tavern()});button('Buy treasure chart (75)',()=>{if(s.gold>=75){s.gold-=75;let p=s.world.ports[Math.floor(rand()*46)];s.treasures.push({id:s.treasures.length,port:p.id,found:false});say('Chart acquired');journal()}});button('Back',portMenu)}function wright(){let f=flag(),d=D.classes[f.type];view('Shipwright',`<p>Hull ${Math.round(f.hull)}/${d.hull} • Sails ${Math.round(f.sail)}%</p>`);button('Repair (60)',()=>{if(s.gold>=60&&(f.hull<d.hull||f.sail<100)){s.gold-=60;f.hull=d.hull;f.sail=100;s.day+=2}wright()});['Fine sails','Cargo hold','Reinforced hull'].forEach(u=>button(u+' (150)',()=>{if(s.gold>=150&&!f.upgrades.includes(u)){s.gold-=150;f.upgrades.push(u)}wright()}).disabled=f.upgrades.includes(u));button('Back',portMenu)}function governor(){view('Governor',`<p>Serve ${D.nations[port.nation]} and earn distinction.</p>`);button('Accept dispatch mission',()=>{let p=s.world.ports[(port.id+7)%46];if(!s.quests.some(q=>q.status==='active'&&q.target===p.id))s.quests.push({id:s.quests.length,target:p.id,status:'active',reward:120,nation:port.nation});journal()});for(let q of s.quests.filter(q=>q.status==='active'&&q.target===port.id))button('Deliver dispatch (+120)',()=>{q.status='complete';s.gold+=q.reward;s.rep[q.nation]=clamp(s.rep[q.nation]+10,-100,100);s.stats.quests++;governor()});button('Back',portMenu)}function journal(){view('Captain’s journal',s.quests.map(q=>`<p>Dispatch to ${esc(s.world.ports[q.target].name)} — ${q.status}</p>`).join('')+s.treasures.map(t=>`<p>Treasure chart ,()=>duelAction(i,true)));['High','Middle','Low'].forEach((a,i)=>button('Attack '+a,()=>duelAction(i,false)));button('Dodge',()=>{duel.stamina=Math.min(100,duel.stamina+15);duel.attack=Math.floor(rand()*3);duel.time=1.8;duelView()})}function duelAction(i,parry){if(parry&&i===duel.attack){duel.enemy-=20;duel.stamina=Math.min(100,duel.stamina+10)}else if(!parry&&i!==duel.attack&&duel.stamina>=10){duel.enemy-=s.talent==='Fencing'?24:16;duel.stamina-=10}else duel.hp-=15;duel.attack=Math.floor(rand()*3);duel.time=1.8;if(duel.enemy<=0)loot(battle.v);else if(duel.hp<=0)defeat();else duelView()}function defeat(){s.gold=Math.floor(s.gold/2);flag().hull=20;flag().crew=Math.max(5,Math.floor(flag().crew*.7));s.morale=35;view('Escaped defeat','Your surviving crew escaped with half your gold.');button('Continue',resume)}function loot(v){s.world.ships=s.world.ships.filter(x=>x.id!==v.id);s.gold+=v.gold;s.stats.wins++;s.morale=clamp(s.morale+15,0,100);view('Prize secured',`<p>Recovered ${v.gold} gold. Choose the fate of ${esc(v.name)}.</p>`);button('Transfer cargo',()=>{for(let i=1;i<13;i++){let n=Math.min(v.cargo[i],capacity()-cargo());flag().cargo[i]+=n;v.cargo[i]-=n}say('Cargo transferred')});button('Capture vessel',()=>{if(s.fleet.length<8&&flag().crew>D.classes[flag().type].min+5){let n=Math.min(flag().crew-D.classes[flag().type].min,D.classes[v.type].min);flag().crew-=n;v.crew=n;v.hull=Math.max(1,v.hull);s.fleet.push(v);resume()}else alert('Not enough crew or fleet space.')});button('Release prize',resume)}function divide(){let n=Math.floor(s.gold*.35);view('Divide plunder',`<p>Personal fortune +${n}; crew receives ${s.gold-n}. Expedition funds reset to 0.</p>`);button('Confirm',()=>{s.personal+=n;s.gold=0;s.morale=100;s.day+=14;portMenu()});button('Cancel',portMenu)}function retire(){let score=Math.floor(s.personal/20+s.gold/100+s.stats.wins*10+s.stats.quests*5+s.stats.treasures*15);view('Career summary',`<p>${esc(s.name)} • Fame ${score} • Personal fortune ${s.personal} • Victories ${s.stats.wins}</p>`);button('Record retirement',()=>{let h=JSON.parse(localStorage.getItem('pcl-hall')||'[]');h.push({name:s.name,score});localStorage.setItem('pcl-hall',JSON.stringify(h));menu()});button('Continue career',portMenu)}function hall(){view('Hall of Fame',(JSON.parse(localStorage.getItem('pcl-hall')||'[]')).sort((a,b)=>b.score-a.score).map(x=>`<p>${esc(x.name)} — ${x.score}</p>`).join('')||'No recorded careers.');button('Back',menu)}function saves(){view('Save and load');for(let i=1;i<=3;i++){if(s)button('Save '+i,()=>save(i));button('Load '+i,()=>load(i))}if(s)button('Export JSON',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='career.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});button('Import JSON',()=>$('importer').click());button('Back',s?resume:menu)}$('importer').onchange=async e=>{try{restore(JSON.parse(await e.target.files[0].text()))}catch{alert('Invalid save file')}e.target.value=''};function settings(){view('Settings','<label>Effects volume <input id=vol type=range min=0 max=1 step=.05 value='+volume+'></label>');$('vol').oninput=e=>volume=+e.target.value;button('Fullscreen',()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.());button('Back',s?resume:menu)}function help(){view('How to play','<p>W/S adjust sails, A/D steer, Space interacts. Tap the sea to navigate. M opens chart, J journal, F fleet. In battle steer with A/D, Q/E fire broadsides, 1/2/3 select round/chain/grape, B boards at close range. Parry the indicated attack in duels. Visit ports to provision and trade.</p>');button('Back',s?resume:menu)}function map(){mode='map';panel.innerHTML='';say('Tap a destination on the chart; M returns to sea.')}function action(k){if(k==='escape'){if(s){view('Paused');button('Resume',resume);button('Save / load',saves);button('Settings',settings);button('Main menu',()=>{save();menu()})}return}if(mode==='battle'){if(k==='q')fire(-1);if(k==='e')fire(1);if('123'.includes(k)&&k.length===1)battle.ammo=+k-1;if(k==='b')board();return}if(mode==='map'&&k==='m')return resume();if(mode!=='sail')return;if(k===' ')interact();if(k==='m')map();if(k==='j')journal();if(k==='f')fleet();if(k==='i')viewInventory()}function viewInventory(){view('Cargo',D.goods.map((g,i)=>`<p>${g}: ${i===0?s.food.toFixed(1):flag().cargo[i]}</p>`).join(''));button('Back',resume)}window.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(!e.repeat)action(k)});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>keys={});[['◀','a'],['▲','w'],['▼','s'],['▶','d']].forEach(([t,k])=>{let b=button(t,()=>{},touch);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});button('Action',()=>action(mode==='battle'?'b':' '),touch);button('Port fire',()=>fire(-1),touch);button('Starboard fire',()=>fire(1),touch);[['Chart',map],['Journal',journal],['Fleet',fleet],['Cargo',viewInventory],['Save',saves],['Pause',()=>action('escape')]].forEach(([t,f])=>button(t,()=>{if(mode==='sail'||mode==='map')f()},nav));c.onpointerdown=e=>{if(!s||!['sail','map'].includes(mode))return;let p=projection();s.target={x:(e.clientX-p.ox)/p.z,y:(e.clientY-p.oy)/p.z};if(mode==='map')resume()};c.onwheel=e=>{if(mode==='sail'){e.preventDefault();zoom=clamp(zoom-e.deltaY*.001,.5,2)}},{passive:false};function projection(){let z=mode==='map'?Math.min(c.width/W,c.height/H):zoom;return {z,ox:mode==='map'?(c.width-W*z)/2:c.width/2-cam.x*z,oy:mode==='map'?(c.height-H*z)/2:c.height/2-cam.y*z}}function update(dt){if(mode==='sail'){let f=flag(),d=D.classes[f.type],turn=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(turn){s.heading+=turn*d.turn*dt;s.target=null}if(keys.w||keys.arrowup)s.throttle=clamp(s.throttle+dt,0,1);if(keys.s||keys.arrowdown)s.throttle=clamp(s.throttle-dt,0,1);if(s.target){if(dist(s.pos,s.target)<15){s.target=null;s.throttle=0}else{s.heading=angle(s.pos,s.target);s.throttle=1;for(let a of [0,.5,-.5,1,-1,1.6,-1.6,2.4]){let h=s.heading+a;if(!land(s.pos.x+Math.cos(h)*28,s.pos.y+Math.sin(h)*28)){s.heading=h;break}}}}let max=Math.min(...s.fleet.map(v=>D.classes[v.type].speed));let speed=max*windEfficiency(s.heading,s.wind)*f.sail/100*Math.min(1,f.crew/d.min)*s.throttle*(s.talent==='Navigation'?1.12:1)*(f.upgrades.includes('Fine sails')?1.12:1);s.speed+=(speed-s.speed)*dt*2;let x=clamp(s.pos.x+Math.cos(s.heading)*s.speed*dt,0,W),y=clamp(s.pos.y+Math.sin(s.heading)*s.speed*dt,0,H);if(!land(x,y)||land(s.pos.x,s.pos.y)){s.pos={x,y}}else{s.speed=0;say('Coast ahead — change course')}cam.x+=(s.pos.x-cam.x)*dt*5;cam.y+=(s.pos.y-cam.y)*dt*5;acc+=dt;if(acc>=1){acc-=1;s.day+=.25;s.food=Math.max(0,s.food-crew()*.0025);s.morale=clamp(s.morale+(s.food>0?-.025:-.8),0,100);if(s.morale<20&&rand()<.08)f.crew=Math.max(1,f.crew-1);if(Math.floor(s.day*4)%40===0){s.wind+=rand()-.5;save()}for(let p of s.world.ports){let i=Math.floor(rand()*13);p.stock[i]=clamp(p.stock[i]+(rand()>.45?1:-1),0,120)}}for(let v of s.world.ships){let p=s.world.ports[v.dest];v.heading=angle(v,p);if(dist(v,p)<15){v.dest=Math.floor(rand()*46);v.origin=p.id}else{v.x+=Math.cos(v.heading)*dt*18;v.y+=Math.sin(v.heading)*dt*18}}}else if(mode==='battle'){let b=battle,f=flag();b.p.h+=((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0))*dt*2;let sp=(keys.s||keys.arrowdown?10:55)*f.sail/100*windEfficiency(b.p.h,s.wind);b.p.x=clamp(b.p.x+Math.cos(b.p.h)*sp*dt,20,980);b.p.y=clamp(b.p.y+Math.sin(b.p.h)*sp*dt,20,680);b.e.h=angle(b.e,b.p)+Math.PI/2;b.e.x=clamp(b.e.x+Math.cos(b.e.h)*dt*25,20,980);b.e.y=clamp(b.e.y+Math.sin(b.e.h)*dt*25,20,680);b.reload-=dt;b.enemyReload-=dt;if(b.enemyReload<0&&dist(b.p,b.e)<300){b.enemyReload=3-s.difficulty*.25;let h=angle(b.e,b.p);b.shots.push({x:b.e.x,y:b.e.y,vx:Math.cos(h)*180,vy:Math.sin(h)*180,life:2,enemy:true})}for(let p of b.shots){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(dist(p,p.enemy?b.p:b.e)<19){p.life=0;if(p.enemy)f.hull-=f.upgrades.includes('Reinforced hull')?3:5;else if(b.ammo===0)b.v.hull-=8+(s.talent==='Gunnery'?3:0);else if(b.ammo===1)b.v.sail=Math.max(10,b.v.sail-9);else b.v.crew=Math.max(0,b.v.crew-3)}}b.shots=b.shots.filter(p=>p.life>0);if(f.hull<=0)defeat();else if(b.v.hull<=0||b.v.crew===0)loot(b.v)}else if(mode==='duel'){duel.time-=dt;if(duel.time<=0){duel.hp-=10;duel.attack=Math.floor(rand()*3);duel.time=1.8;if(duel.hp<=0)defeat();else duelView()}}}function drawShip(x,y,h,size,color){ctx.save();ctx.translate(x,y);ctx.rotate(h);ctx.scale(size,size);ctx.fillStyle='#153e4c';ctx.fillRect(-18,8,35,3);ctx.fillStyle='#593822';ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(7,-8);ctx.lineTo(-16,-7);ctx.lineTo(-19,0);ctx.lineTo(-16,7);ctx.lineTo(7,8);ctx.closePath();ctx.fill();ctx.fillStyle='#b88a49';ctx.fillRect(-12,-5,20,10);ctx.fillStyle='#fff0c8';ctx.fillRect(-5,-11,5,22);ctx.fillRect(6,-8,4,16);ctx.fillStyle=color;ctx.fillRect(-14,-10,8,5);ctx.restore()}function render(t){let w=c.clientWidth,h=c.clientHeight;if(c.width!==w||c.height!==h){c.width=w;c.height=h}ctx.fillStyle='#17687b';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff18';for(let y=0;y<h;y+=24)for(let x=0;x<w;x+=45){ctx.beginPath();let a=x+Math.sin(t*.001+y)*8;ctx.moveTo(a,y);ctx.lineTo(a+12,y);ctx.stroke()}if(mode==='battle'||mode==='duel'){ctx.save();ctx.scale(w/1000,h/700);drawShip(battle.p.x,battle.p.y,battle.p.h,2,'#eee');drawShip(battle.e.x,battle.e.y,battle.e.h,2,'#a33');ctx.fillStyle='#ffe6a0';for(let p of battle.shots)ctx.fillRect(p.x,p.y,5,5);ctx.restore()}else if(s&&mode!=='menu'){let p=projection();ctx.save();ctx.translate(p.ox,p.oy);ctx.scale(p.z,p.z);for(let poly of D.land){ctx.beginPath();for(let i=0;i<poly.length;i+=2){let a=xy(poly[i],poly[i+1]);i?ctx.lineTo(a.x,a.y):ctx.moveTo(a.x,a.y)}ctx.closePath();ctx.strokeStyle='#dfc48a';ctx.lineWidth=12;ctx.stroke();ctx.fillStyle='#477c48';ctx.fill()}for(let v of s.world.ships)drawShip(v.x,v.y,v.heading,.55,['#eee','#65a8ee','#e7c44e','#e78b45'][v.nation]);for(let a of s.world.ports){ctx.fillStyle='#e7c38b';ctx.fillRect(a.x-4,a.y-4,8,8);ctx.fillStyle='#fff4d5';ctx.font=`${mode==='map'?22:12}px Georgia`;ctx.fillText(a.name,a.x+6,a.y-6)}drawShip(s.pos.x,s.pos.y,s.heading,1,'#e6be50');if(s.target){ctx.strokeStyle='#fff8';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(s.pos.x,s.pos.y);ctx.lineTo(s.target.x,s.target.y);ctx.stroke();ctx.setLineDash([])}ctx.restore()}else{ctx.fillStyle='#e8b56c';ctx.beginPath();ctx.arc(w*.78,h*.24,55,0,7);ctx.fill();drawShip(w*.75+Math.sin(t*.0004)*40,h*.65,0,4,'#a33')}if(s&&!hud.hidden&&t-clock>150){clock=t;let date=new Date(Date.UTC(s.year,0,1+Math.floor(s.day)));hud.textContent=`${s.name} | ${s.gold} gold | Crew ${crew()} | Morale ${Math.round(s.morale)}% | Food ${s.food.toFixed(1)} | ${date.toISOString().slice(0,10)} | Wind ${Math.round((s.wind*180/Math.PI+360)%360)}° | ${mode==='battle'?'Hull '+Math.round(flag().hull)+' • Enemy '+Math.round(battle.v.hull)+' • '+['Round','Chain','Grape'][battle.ammo]:Math.round(s.speed/10)+' knots'} | ${notice}`}}let accumulator=0;function frame(t){let dt=Math.min(.1,(t-last)/1000||0);last=t;accumulator+=dt;while(accumulator>=1/60){if(s&&!document.hidden)update(1/60);accumulator-=1/60}render(t);requestAnimationFrame(frame)}menu();requestAnimationFrame(frame);})();
