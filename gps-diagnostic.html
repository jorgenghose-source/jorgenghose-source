<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Skyward · GPS fault trace</title><style>:root{color-scheme:dark}body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#0c1426;color:#f4f7ff;max-width:600px;margin:auto;padding:30px 20px}h1{font-size:28px}p{color:#b6c6de;line-height:1.5}button{background:#f5d49b;color:#152036;border:0;border-radius:14px;font-weight:700;padding:17px 20px;font-size:16px;min-height:52px}pre{background:#172742;border:1px solid #3b5272;border-radius:14px;padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65}a{color:#f5d49b}#result{font-weight:700}</style></head><body><h1>GPS fault trace</h1><p>This page tests Safari geolocation without Skyward, SunCalc, or any external scripts. No coordinates are uploaded or stored. Tap the button directly in Safari.</p><button id="test">Run GPS test</button> <button id="copy" style="background:#283b58;color:white">Copy report</button><p id="result">Not tested</p><pre id="log"></pre><p><a href="index.html">Back to Skyward</a></p><script>
const log=document.getElementById('log'),result=document.getElementById('result'),btn=document.getElementById('test');
function write(s){log.textContent+='['+new Date().toLocaleTimeString()+'] '+s+'\n'}
function inspect(){write('URL origin: '+location.origin);write('Secure context: '+isSecureContext);write('Top-level page: '+(top===self));write('Geolocation available: '+!!navigator.geolocation);write('Browser: '+navigator.userAgent);try{const p=document.permissionsPolicy||document.featurePolicy;write('Permissions Policy geolocation: '+(p?.allowsFeature?p.allowsFeature('geolocation'):'not exposed'))}catch(e){write('Permissions Policy query error: '+e.message)}}
inspect();btn.onclick=()=>{log.textContent='';inspect();result.textContent='Requesting position…';btn.disabled=true;const start=performance.now();if(!navigator.geolocation){result.textContent='Geolocation API missing';btn.disabled=false;return}write('getCurrentPosition invoked directly from button tap');navigator.geolocation.getCurrentPosition(p=>{btn.disabled=false;result.textContent='SUCCESS — location available';write('SUCCESS after '+Math.round(performance.now()-start)+' ms');write('Latitude: '+p.coords.latitude);write('Longitude: '+p.coords.longitude);write('Accuracy: ±'+Math.round(p.coords.accuracy)+' m');write('Position age: '+(Date.now()-p.timestamp)+' ms')},e=>{btn.disabled=false;result.textContent='FAILED — '+({1:'Permission denied',2:'Position unavailable',3:'Timeout'}[e.code]||'Unknown');write('FAILED after '+Math.round(performance.now()-start)+' ms');write('Error code: '+e.code);write('Error message: '+e.message);write('Code 1 means the browser refused permission; it does not identify which permission layer refused.')},{enableHighAccuracy:false,maximumAge:0,timeout:20000})};document.getElementById('copy').onclick=()=>{const text=result.textContent+'\n'+log.textContent;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>alert('Report copied')).catch(()=>prompt('Copy report',text));else prompt('Copy report',text)};
</script></body></html>
